---
# Play 1 — Live-USB install through first reboot (Phase 0-1).
# Runs on the live USB (root@archiso). See ansible/README.md for the user flow.
# Distro selected by the inventory group localhost is under (auto-loads
# inventory/group_vars/<distro>.yml — ADR-002).
- name: Arch Linux live-USB install (Phase 0-1)
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - name: Check for the live-USB marker (play 1 gate)
      ansible.builtin.stat:
        path: /run/archiso
      register: play1_archiso

    - name: Assert running on the live USB (play 1 gate)
      ansible.builtin.assert:
        that:
          - play1_archiso.stat.exists
        fail_msg: >-
          This play runs on the live USB, not the installed system
          (/run/archiso is missing). Boot from the Arch live USB and re-run
          make run. Do NOT run this play on your installed system — it will
          wipe the target drive.
  roles:
    - role: verify_boot_network
      tags:
        - verify_boot_network
    - role: partitioning
      tags:
        - partitioning
    - role: filesystems_btrfs
      tags:
        - filesystems_btrfs
    - role: install_base
      tags:
        - install_base
    - role: gpu
      tags:
        - nvidia
      when: gpu_vendor is defined
    - role: system_config
      tags:
        - system_config
    - role: users_sudo
      tags:
        - users_sudo
    - role: bootloader_grub
      tags:
        - bootloader_grub
    - role: first_reboot
      tags:
        - first_reboot
