---
# Option A distro layer: per-distro package names, commands, paths, and
# layout constants. Selected via the ansible_distro inventory var.
# Adding a distro = adding a file here, no role rewrites (spec 002).
distro_packages:
  base:
    - base
    - base-devel
    - linux
    - linux-headers
    - linux-firmware
    - nano
    - git
  # CPU microcode selected by cpu_vendor (per-machine, inventory/hosts.yml).
  # Keep in sync with the install-base packages list in os/archlinux/manifest.yaml
  # (intel-ucode is a same-name swap for amd-ucode, so the parity checker passes
  # for either vendor).
  ucode:
    amd: amd-ucode
    intel: intel-ucode
  # Filesystem tooling selected by fstype (per-machine, inventory/hosts.yml).
  # Only btrfs is implemented for now; other fstypes add their tools here.
  fstools:
    btrfs: btrfs-progs
  chroot_core:
    - networkmanager
  bootloader:
    - grub
    - efibootmgr
    - os-prober
    - mtools
    - dosfstools
  # Play 2 (Phase 2, booted system): per-module package lists, selected by the
  # enable_<module> inventory flags. Keep in sync with phase-2 modules in
  # os/archlinux/manifest.yaml (parity checker enforces this).
  snapshots:
    - snapper
    - snap-pac
    - grub-btrfs
    - btrfs-assistant
    - rsync
  sound:
    - pipewire
    - wireplumber
    - pipewire-alsa
    - pipewire-pulse
    - pipewire-jack
    - helvum
    - playerctl
    - mpv-mpris
  networking:
    - bluez
    - bluez-utils
    - bluetui
  firewall:
    - ufw
  external_drives:
    - ntfs-3g
    - udisks2
    - udiskie
  ssh:
    - openssh
  # Play 3 (Phase 3, booted system): per-module package lists, selected by the
  # enable_<module> inventory flags. Keep in sync with phase-3 modules in
  # os/archlinux/manifest.yaml (parity checker enforces this). Config-free
  # (spec 005, ADR-014): these roles install packages only; all dotfiles are
  # owned by the user's stow package.
  shell_terminal:
    - zsh
    - oh-my-zsh
    - fzf
    - zoxide
  app_launcher:
    - rofi-wayland
  status_bar:
    - waybar
  notifications:
    - swaync
    - mako
  display_manager:
    - greetd
    - greetd-tuigreet
  clipboard:
    - wl-clipboard
    - clipse
  screenshots:
    - grim
    - slurp
    - swappy
  file_manager:
    - thunar
    - thunar-archive-plugin
    - thunar-vcs-plugin
  fonts:
    - fontconfig
    - noto-fonts
    - noto-fonts-cjk
    - noto-fonts-emoji
    - ttf-jetbrains-mono-nerd
    - ttf-material-design-icons
  # Play 4 (Phase 4, booted system): per-module package lists, selected by the
  # enable_<module> inventory flags (and the profile_* convenience vars).
  # Keep in sync with phase-4 modules in os/archlinux/manifest.yaml (parity
  # checker enforces this). Config-free (spec 006, ADR-016): roles install
  # packages + the four named system-level artifacts only; all dotfiles are
  # owned by the user's stow package.
  dotfiles_backup:
    - stow
  containers:
    - podman
  remote_ssh:
    - openssh
    - openbsd-netcat
    - procps-ng
  neovim:
    - neovim
  inference:
    - cuda
  harness:
    - opencode
  steam:
    - steam
  mangohud:
    - mangohud
  obs:
    - obs-studio
  media_players:
    - mpv
# Play 4 (Phase 4, booted system): profile-structured module data (spec 006).
# Per-module AUR packages (installed via the Phase 2 yay helper; D4) and npm
# global packages (user context). The manifest stays the source of truth for
# the pacman lists above; these lists carry what the manifest does not
# (AUR/npm names).
phase4:
  aur:
    containers:
      - lazydocker
    inference:
      - llama-cpp-cuda
    agents:
      - claude-desktop
  npm:
    harness:
      - kilocode
      - "@anthropic-ai/claude-code"
      - "@google-gemini/gemini-cli"
  # Model downloads (D5): flag-gated behind enable_ai_models, wget -c into
  # ~/models/. Keep in sync with the wget commands in profile-ai/inference.md
  # and profile-ai/agents.md (the human-facing source).
  models:
    inference:
      - url: https://huggingface.co/ggml-org/gemma-4-E2B-GGUF/resolve/main/gemma-4-E2B-Q8_0.gguf
        filename: gemma-4-E2B-Q8_0.gguf
      - url: https://huggingface.co/unsloth/gemma-4-12b-it-GGUF/resolve/main/gemma-4-12b-it-UD-Q6_K_XL.gguf
        filename: gemma-4-12b-it-UD-Q6_K_XL.gguf
      - url: https://huggingface.co/unsloth/gemma-4-12b-it-GGUF/resolve/main/mmproj-BF16.gguf
        filename: gemma-4-12B-it-mmproj-BF16.gguf
      - url: https://huggingface.co/williamliao/gemma-4-12B-it-DFlash-GGUF/resolve/main/gemma4-12B-it-DFlash-Q4_K_M.gguf
        filename: gemma-4-12B-it-DFlash-Q4_K_M.gguf
      - url: https://huggingface.co/deepreinforce-ai/Ornith-1.0-35B-GGUF/resolve/main/ornith-1.0-35b-Q6_K.gguf
        filename: ornith-1.0-35b-Q6_K.gguf
      - url: https://huggingface.co/SC117/Ornith-1.0-35B-MTP-APEX-GGUF/resolve/main/mmproj-F16.gguf
        filename: ornith-1.0-35b-mmproj-F16.gguf
      - url: https://huggingface.co/williamliao/Qwen3.6-35B-A3B-DFlash-GGUF/resolve/main/Qwen3.6-35B-A3B-DFlash-Q4_K_M.gguf
        filename: ornith-1.0-35b-dflash-Q4_K_M.gguf
    agents:
      - url: https://huggingface.co/NousResearch/Hermes-3-Llama-3.1-8B-GGUF/resolve/main/Hermes-3-Llama-3.1-8B.Q4_K_M.gguf
        filename: Hermes-3-Llama-3.1-8B.Q4_K_M.gguf
  devpod:
    url: https://github.com/loft-sh/devpod/releases/latest/download/devpod-linux-amd64
    path: /usr/local/bin/devpod
# GPU module (Phase 1, chroot): vendor-agnostic data. gpu_vendor
# (inventory) selects the entry AND gates the role (no separate enable flag):
# 'nvidia' runs the nvidia tasks; 'none'/'amd'/'intel' skip. The nvidia_driver
# inventory var selects the base driver package within the nvidia entry.
# Mirrors the cpu_vendor/fstype pattern.
gpu:
  nvidia:
    # Base driver package, selected by the nvidia_driver inventory var.
    # nvidia-open: Turing (RTX 20xx) and newer + linux kernel (default).
    # nvidia: Maxwell-Pascal (GTX 9xx/10xx) + linux kernel.
    # (-dkms variants exist for non-linux kernels but install_base always
    #  pacstraps the standard 'linux' kernel, so they are not listed here.)
    drivers:
      nvidia-open:
        packages:
          - nvidia-open
          - nvidia-utils
          - lib32-nvidia-utils
          - nvidia-settings
        hook_target: nvidia-open
      nvidia:
        packages:
          - nvidia
          - nvidia-utils
          - lib32-nvidia-utils
          - nvidia-settings
        hook_target: nvidia
    mkinitcpio_modules:
      - nvidia
      - nvidia_modeset
      - nvidia_uvm
      - nvidia_drm
    grub_cmdline: "nvidia_drm.modeset=1 nvidia_drm.fbdev=1"
  amd: {}
  intel: {}
  none: {}
# Play 3 (Phase 3, booted system): window-manager-agnostic data. wm_vendor
# (inventory) selects the entry. 'hyprland' is implemented (base package set for
# the 5 hyprland-* roles); 'niri', 'sway', and 'none' are declared (empty data)
# so adding a WM later is data + one role branch, no rewrite. Mirrors the
# gpu_vendor/fstype/cpu_vendor selectable pattern (spec 005 D3). Config-free:
# the base list carries packages only; hyprland.conf and friends are stow-owned.
wm:
  hyprland:
    packages:
      - hyprland
      - wayland
      - xdg-desktop-portal-hyprland
      - kitty
      - qt5-wayland
      - qt6-wayland
      - firefox
      - yazi
  niri: {}
  sway: {}
  none: {}
distro_commands:
  pacstrap: pacstrap
  genfstab: genfstab
  arch_chroot: arch-chroot
  pacman: pacman
  systemctl: systemctl
  mkinitcpio: mkinitcpio
  grub_mkconfig: grub-mkconfig
  snapper: snapper
  timedatectl: timedatectl
  ufw: ufw
distro_paths:
  efi_mount: /boot/efi
  locale_gen: /etc/locale.gen
  locale_conf: /etc/locale.conf
  hostname_file: /etc/hostname
  fstab: /etc/fstab
  grub_default: /etc/default/grub
  grub_cfg: /boot/grub/grub.cfg
  sudoers_wheel: /etc/sudoers.d/wheel
  zoneinfo_dir: /usr/share/zoneinfo
  pacman_conf: /etc/pacman.conf
  mkinitcpio_conf: /etc/mkinitcpio.conf
  pacman_hooks_dir: /etc/pacman.d/hooks
  snapper_config_dir: /etc/snapper/configs
btrfs:
  subvolumes:
    - name: "@"
      mount: /
    - name: "@home"
      mount: /home
    - name: "@snapshots"
      mount: /.snapshots
    - name: "@var_log"
      mount: /var/log
    - name: "@pkg"
      mount: /var/cache/pacman/pkg
  mount_options: "noatime,compress=zstd:3,ssd,space_cache=v2"
  fs_label: ARCH
  mkfs_args: -L ARCH
partitioning:
  efi_code: ef00
  swap_code: 8200
  root_code: 8300
sudo_group: wheel
sudo_shell: /bin/bash
keyring_package: archlinux-keyring
