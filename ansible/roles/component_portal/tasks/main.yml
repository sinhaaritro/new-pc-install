---
- name: Install component x_packages
  ansible.builtin.include_role:
    name: install_packages
  vars:
    install_packages_source: "{{ x_packages.component_portal }}"

- name: Enable xdg-desktop-portal
  ansible.builtin.systemd:
    name: xdg-desktop-portal.service
    enabled: true
    state: started

- name: Enable xdg-desktop-portal-hyprland
  ansible.builtin.systemd:
    name: xdg-desktop-portal-hyprland.service
    enabled: true
    state: started

- name: Stow component config
  ansible.builtin.command: "stow -R portal"
  args:
    chdir: "/home/{{ x_target_user }}/dotfiles"
    creates: "/home/{{ x_target_user }}/.config/portal"
  become: true
  become_user: "{{ x_target_user }}"
