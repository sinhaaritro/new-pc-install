---
# Role: bootloader_grub (manifest module id: bootloader)
# Module 07: grub install, grub-mkconfig, os-prober, efibootmgr (chroot-stage).
# The Windows EFI partition is mounted host-side so os-prober can see it.

- name: Identify Windows EFI partition (module bootloader)
  ansible.builtin.shell: |
    lsblk -dn -o NAME,FSTYPE,SIZE | awk '$2 == "vfat" && $3 ~ /M/ {print $1}'
  args:
    executable: /bin/bash
  register: bootloader_win_efi
  changed_when: false

- name: Set Windows EFI device fact
  ansible.builtin.set_fact:
    win_efi_device: "/dev/{{ bootloader_win_efi.stdout_lines | first | default('') }}"
  when: bootloader_win_efi.stdout_lines | length > 0

- name: Mount Windows EFI partition for os-prober
  ansible.builtin.mount:
    path: /tmp/win_efi
    src: "{{ win_efi_device }}"
    state: mounted
    fstype: vfat
  when: win_efi_device is defined

- name: Install GRUB packages in new system
  ansible.builtin.shell: arch-chroot {{ mount_point }} pacman -S --noconfirm {{ bootloader_packages | join(' ') }}
  args:
    executable: /bin/bash
  register: bootloader_pacman
  changed_when: bootloader_pacman.rc == 0

- name: Enable os-prober in grub default config
  ansible.builtin.shell: |
    arch-chroot {{ mount_point }} sh -c '
      if grep -q "^GRUB_DISABLE_OS_PROBER" /etc/default/grub; then
        sed -i "s/^GRUB_DISABLE_OS_PROBER=.*/GRUB_DISABLE_OS_PROBER=false/" /etc/default/grub
      else
        echo "GRUB_DISABLE_OS_PROBER=false" >> /etc/default/grub
      fi
    '
  args:
    executable: /bin/bash

- name: Install GRUB to the EFI partition
  ansible.builtin.shell: arch-chroot {{ mount_point }} grub-install --target=x86_64-efi --efi-directory=/boot/efi --bootloader-id=GRUB --removable
  args:
    executable: /bin/bash
  register: bootloader_grub_install
  changed_when: bootloader_grub_install.rc == 0

- name: Generate GRUB configuration (module bootloader)
  ansible.builtin.shell: arch-chroot {{ mount_point }} grub-mkconfig -o /boot/grub/grub.cfg
  args:
    executable: /bin/bash
  register: bootloader_mkconfig

- name: Verify GRUB config contains the Linux entry
  ansible.builtin.shell: grep -c "menuentry" {{ mount_point }}/boot/grub/grub.cfg
  args:
    executable: /bin/bash
  register: bootloader_menuentries
  changed_when: false

- name: Assert GRUB found the Linux image
  ansible.builtin.assert:
    that:
      - bootloader_menuentries.stdout | int > 0
    fail_msg: >-
      grub-mkconfig produced no menu entries. Check /boot/efi is mounted
      and kernel files exist under {{ mount_point }}/boot.

- name: Report Windows detection (informational)
  ansible.builtin.debug:
    msg: >-
      {{ bootloader_mkconfig.stdout if 'Windows Boot Manager' in bootloader_mkconfig.stdout
         else 'WARNING: os-prober did not detect Windows. If dual-boot is expected,
         verify the Windows EFI partition was mounted and re-run grub-mkconfig.' }}

- name: Register GRUB with efibootmgr
  ansible.builtin.shell: arch-chroot {{ mount_point }} efibootmgr -v
  args:
    executable: /bin/bash
  changed_when: false

- name: Unmount Windows EFI partition
  ansible.builtin.mount:
    path: /tmp/win_efi
    state: absent
  when: win_efi_device is defined
