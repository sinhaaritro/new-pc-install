---
# Role: bootloader_grub (manifest module id: bootloader)
# Module 07: grub install, grub-mkconfig, os-prober, efibootmgr (chroot-stage).
# The Windows EFI partition is mounted host-side so os-prober can see it.
# Package lists are read directly from the global distro file (ADR-002).

- name: Identify Windows EFI partition (module bootloader)
  ansible.builtin.shell: |
    set -o pipefail
    lsblk -dn -o NAME,FSTYPE,SIZE | awk '$2 == "vfat" && $3 ~ /M/ {print $1}'
  args:
    executable: /bin/bash
  register: bootloader_grub_win_efi
  changed_when: false

- name: Set Windows EFI device fact
  ansible.builtin.set_fact:
    bootloader_grub_win_efi_device: "/dev/{{ bootloader_grub_win_efi.stdout_lines | first | default('') }}"
  when: bootloader_grub_win_efi.stdout_lines | length > 0

- name: Mount Windows EFI partition for os-prober
  ansible.posix.mount:
    path: /tmp/win_efi
    src: "{{ bootloader_grub_win_efi_device }}"
    state: mounted
    fstype: vfat
  when: bootloader_grub_win_efi_device is defined

- name: Install GRUB packages in new system
  ansible.builtin.shell: "arch-chroot {{ mount_point }} {{ distro_install }} {{ distro_packages.bootloader | join(' ') }}"
  args:
    executable: /bin/bash
  register: bootloader_grub_pacman
  changed_when: bootloader_grub_pacman.rc == 0

- name: Enable os-prober in grub default config
  ansible.builtin.shell: |
    arch-chroot {{ mount_point }} sh -c '
      if grep -q "^GRUB_DISABLE_OS_PROBER" /etc/default/grub; then
        sed -i "s/^GRUB_DISABLE_OS_PROBER=.*/GRUB_DISABLE_OS_PROBER=false/" /etc/default/grub
      else
        echo "GRUB_DISABLE_OS_PROBER=false" >> /etc/default/grub
      fi
    '
  args:
    executable: /bin/bash
  register: bootloader_grub_osprober
  changed_when: bootloader_grub_osprober.rc == 0

- name: Configure GRUB default entry (module bootloader)
  ansible.builtin.shell: |
    arch-chroot {{ mount_point }} sh -c '
      if [ -n "{{ grub_default | default("") }}" ]; then
        if [ "{{ grub_default }}" = "saved" ]; then
          sed -i "s/^GRUB_DEFAULT=.*/GRUB_DEFAULT=saved/" /etc/default/grub
          if grep -q "^GRUB_SAVEDEFAULT" /etc/default/grub; then
            sed -i "s/^GRUB_SAVEDEFAULT=.*/GRUB_SAVEDEFAULT=true/" \
              /etc/default/grub
          else
            echo "GRUB_SAVEDEFAULT=true" >> /etc/default/grub
          fi
        else
          sed -i "s/^GRUB_DEFAULT=.*/GRUB_DEFAULT=\"{{ grub_default }}\"/" \
            /etc/default/grub
        fi
      fi
    '
  args:
    executable: /bin/bash
  register: bootloader_grub_default
  changed_when: >-
    bootloader_grub_default.rc == 0
    and (grub_default | default("") | length) > 0

- name: Set the saved GRUB default to the Windows entry (module bootloader)
  ansible.builtin.shell: >-
    arch-chroot {{ mount_point }}
    grub-set-default "{{ grub_default }}"
  args:
    executable: /bin/bash
  register: bootloader_grub_set_default
  changed_when: bootloader_grub_set_default.rc == 0
  when: >-
    grub_default is defined
    and grub_default | length > 0
    and grub_default != "saved"

- name: Install GRUB to the EFI partition
  ansible.builtin.shell: arch-chroot {{ mount_point }} grub-install --target=x86_64-efi --efi-directory=/boot/efi --bootloader-id=GRUB --removable
  args:
    executable: /bin/bash
  register: bootloader_grub_install
  changed_when: bootloader_grub_install.rc == 0

- name: Generate GRUB configuration (module bootloader)
  ansible.builtin.shell: arch-chroot {{ mount_point }} grub-mkconfig -o /boot/grub/grub.cfg
  args:
    executable: /bin/bash
  register: bootloader_grub_mkconfig
  changed_when: bootloader_grub_mkconfig.rc == 0

- name: Verify GRUB config contains the Linux entry
  ansible.builtin.shell: grep -c "menuentry" {{ mount_point }}/boot/grub/grub.cfg
  args:
    executable: /bin/bash
  register: bootloader_grub_menuentries
  changed_when: false

- name: Assert GRUB found the Linux image
  ansible.builtin.assert:
    that:
      - bootloader_grub_menuentries.stdout | int > 0
    fail_msg: >-
      grub-mkconfig produced no menu entries. Check /boot/efi is mounted
      and kernel files exist under {{ mount_point }}/boot.

- name: Report Windows detection (informational)
  ansible.builtin.debug:
    msg: >-
      {{ bootloader_grub_mkconfig.stdout if 'Windows Boot Manager' in bootloader_grub_mkconfig.stdout
         else 'WARNING: os-prober did not detect Windows. If dual-boot is expected,
         verify the Windows EFI partition was mounted and re-run grub-mkconfig.' }}

- name: Register GRUB with efibootmgr
  ansible.builtin.shell: arch-chroot {{ mount_point }} efibootmgr -v
  args:
    executable: /bin/bash
  changed_when: false

- name: Unmount Windows EFI partition
  ansible.posix.mount:
    path: /tmp/win_efi
    state: absent
  when: bootloader_grub_win_efi_device is defined
