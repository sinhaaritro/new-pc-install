---
# Source-build role (spec 002 decisions 2.7, 2.8). The build is machine-specific:
# -DGGML_NATIVE=ON bakes in this CPU's feature set and CUDA arch 89 is Ada-only,
# so artifacts are never portable and never cache-shared between boxes.
# Flags live as a YAML list so inventory can replace or extend the set for a
# different GPU without editing this role.
# noqa: var-naming[no-role-prefix]
llamacpp_repo: https://github.com/ggml-org/llama.cpp
# noqa: var-naming[no-role-prefix]
llamacpp_version: master
# noqa: var-naming[no-role-prefix]
llamacpp_src_dir: "{{ '/home/' + target_user + '/src/llama.cpp' }}"
# noqa: var-naming[no-role-prefix]
llamacpp_jobs: "{{ (ansible_processor_vcpus | default(1)) // 2 | int if (ansible_processor_vcpus | default(2)) | int > 1 else 1 }}"
# noqa: var-naming[no-role-prefix]
cmake_flags:
  - -DCMAKE_BUILD_TYPE=Release
  - -DGGML_CUDA=ON
  - -DCMAKE_CUDA_ARCHITECTURES=89
  - -DGGML_CUDA_FA_ALL_QUANTS=ON
  - -DGGML_CUDA_F16=ON
  - -DGGML_NATIVE=ON
  - -DGGML_AVX512=ON
  - -DGGML_AVX512_VBMI=ON
  - -DGGML_AVX512_VNNI=ON
  - -DGGML_AVX512_BF16=ON
