---
# Source-build role (spec 002 decisions 2.7, 2.8). Flags are layered: portable
# defaults live here, machine-specific flags (GPU arch, CPU feature set) are
# carried in inventory under ai.llamacpp.cmake_flags. The combine below lets
# inventory replace the default list — with recursive=True a list value in
# app_params overwrites the default (no list concat), so an empty slot falls
# back to the portable set and a populated slot fully drives the build.
app_llamacpp_repo: https://github.com/ggml-org/llama.cpp
app_llamacpp_version: master
app_llamacpp_src_dir: "{{ '/home/' + x_target_user + '/aur/llama.cpp' }}"
app_llamacpp_jobs: "{{ (ansible_processor_vcpus | default(1)) // 2 | int if (ansible_processor_vcpus | default(2)) | int > 1 else 1 }}"
app_llamacpp_defaults:
  cmake_flags:
    - -DCMAKE_BUILD_TYPE=Release
app_llamacpp_config: "{{ app_llamacpp_defaults | combine(app_params | default({}), recursive=True) }}"
