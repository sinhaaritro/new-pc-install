---
# Source build (spec 002 decision 2.7): a no-op `git pull` must not trigger a
# half-hour CUDA compile. The `git` module's `changed` flag is the only honest
# signal available, so both cmake calls are gated on it or a missing build
# artifact.
# NOTE: the cmake calls are `command:` tasks; `--check` mode cannot verify
# their real effect (a compiled binary).
- name: Install build dependencies
  ansible.builtin.include_role:
    name: install_packages
  vars:
    install_packages_source: "{{ x_packages.app_llamacpp }}"

- name: Check out llama.cpp at pinned version
  ansible.builtin.git:
    repo: "{{ app_llamacpp_repo }}"
    dest: "{{ app_llamacpp_src_dir }}"
    version: "{{ app_llamacpp_version }}"
    depth: 1
  become: true
  become_user: "{{ x_target_user }}"
  register: app_llamacpp_src

- name: Check for existing build artifact
  ansible.builtin.stat:
    path: "{{ app_llamacpp_src_dir }}/build/bin/llama-cli"
  register: app_llamacpp_build_artifact

- name: Configure llama.cpp
  ansible.builtin.command: "cmake -B build -S . {{ app_llamacpp_cmake_flags | join(' ') }}"
  args:
    chdir: "{{ app_llamacpp_src_dir }}"
  become: true
  become_user: "{{ x_target_user }}"
  when: app_llamacpp_src.changed or not app_llamacpp_build_artifact.stat.exists
  register: app_llamacpp_configure_rc
  changed_when: app_llamacpp_configure_rc.rc == 0

- name: Build llama.cpp
  ansible.builtin.command: "cmake --build build -j {{ app_llamacpp_jobs }}"
  args:
    chdir: "{{ app_llamacpp_src_dir }}"
  become: true
  become_user: "{{ x_target_user }}"
  when: app_llamacpp_src.changed or not app_llamacpp_build_artifact.stat.exists
  register: app_llamacpp_build_rc
  changed_when: app_llamacpp_build_rc.rc == 0
