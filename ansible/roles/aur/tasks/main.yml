---
# Role: aur (manifest module id: aur)
# Phase 2 module 03 on the booted system: build yay from the AUR.
# Build context is the end user (become: false) so the sources and cache
# live in the user's home (excluded from @ snapshots via @home); the final
# package install runs as root with --noconfirm. Makedepends are pre-installed
# so the build itself needs no interactive prompts (spec 004 D4). The
# makedepends (distro_packages.aur_makedepends) are built-from-AUR inputs, not
# manifest packages, so the parity checker does not require them.

- name: Install yay build dependencies (module aur)
  ansible.builtin.shell: pacman -S --noconfirm --needed {{ aur_makedepends | join(' ') }}
  args:
    executable: /bin/bash
  become: true
  register: aur_makedeps
  changed_when: aur_makedeps.rc == 0

- name: Build yay from the AUR as the end user (module aur)
  ansible.builtin.shell: |
    set -e
    mkdir -p /home/{{ end_user }}/aur
    cd /home/{{ end_user }}/aur
    if [ -d yay ]; then
      git -C yay pull
    else
      git clone https://aur.archlinux.org/yay.git
    fi
    cd yay
    rm -f *.pkg.tar.zst
    makepkg
  args:
    executable: /bin/bash
  become: false
  register: aur_build
  changed_when: aur_build.rc == 0

- name: Install the built yay package (module aur)
  ansible.builtin.shell: pacman -U --noconfirm /home/{{ end_user }}/aur/yay/yay-*.pkg.tar.zst
  args:
    executable: /bin/bash
  become: true
  register: aur_install
  changed_when: aur_install.rc == 0

- name: Report yay verification (module aur)
  ansible.builtin.debug:
    msg: >-
      yay installed. Verify with: yay --version
      Usage: yay -S <pkg>, yay -Syu, yay -Rns <pkg>.
