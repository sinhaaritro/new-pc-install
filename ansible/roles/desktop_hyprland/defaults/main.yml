---
# ADR-007 two-variable trick: the profile is the full set, inventory
# `desktop_overrides` (empty by default) is the per-machine delta, and the
# lazily-evaluated `desktop_config` is what tasks consume.
desktop_profile:
  env:
    XDG_CURRENT_DESKTOP: "HYPRLAND"
    XDG_SESSION_TYPE: "wayland"
    XCURSOR_SIZE: "24"
  exec:
    terminal: "kitty"
    files: "org.gnome.Nautilus"
    browser: "brave"
  general:
    gaps_in: 5
    gaps_out: 20
    border_size: 2
    layout: "dwindle"
  decoration:
    active_opacity: "1.0"
    inactive_opacity: "0.85"
  bind:
    - "SUPER, Return, exec, {{ desktop_profile.exec.terminal }}"
    - "SUPER, Q, killactive, "
    - "SUPER, M, exec, {{ desktop_profile.exec.browser }}"
    - "SUPER, C, exec, rofi -show drun"
    - "SUPER, P, exec, grim -g \"$(slur)\" /tmp/shots/shot-$(date +%s).png"
    - "SUPER SHIFT, L, exec, hyprlock"
  bindexec: []
  # Component roster (ADR-021): presence = installed, `~` subtracts. The play
  # loops this dict null-filtered, so no task ever gates with `when:`.
  components:
    bar: {}
    notification: {}
    screenshot: {}
    launcher: {}
    lock: {}
    idle: {}
    clipboard: {}
    portal: {}
desktop_overrides: {}
desktop_config: "{{ desktop_profile | combine(desktop_overrides | default({}), recursive=True) }}"
