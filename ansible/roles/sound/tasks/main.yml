---
# Role: sound (manifest module id: sound)
# Phase 2 module 04 on the booted system: PipeWire + WirePlumber stack.
# Root installs the packages; the PipeWire/WirePlumber user sockets are
# enabled in the end user's session via the sudo -u wrapper (spec 004 D1),
# which works whether the play is invoked by the user or by root.

- name: Install PipeWire stack (module sound)
  ansible.builtin.shell: pacman -S --noconfirm {{ sound_packages | join(' ') }}
  args:
    executable: /bin/bash
  become: true
  register: sound_pacman
  changed_when: sound_pacman.rc == 0

- name: Resolve the end user uid (module sound)
  ansible.builtin.shell: id -u {{ end_user }}
  args:
    executable: /bin/bash
  become: true
  register: sound_uid
  changed_when: false

- name: Enable PipeWire user services (module sound)
  ansible.builtin.shell: >-
    sudo -u {{ end_user }} env XDG_RUNTIME_DIR=/run/user/{{ sound_uid.stdout }}
    systemctl --user enable --now pipewire.socket pipewire-pulse.socket wireplumber.service
  args:
    executable: /bin/bash
  become: true
  register: sound_user_services
  changed_when: sound_user_services.rc == 0

- name: Report sound verification (module sound)
  ansible.builtin.debug:
    msg: >-
      PipeWire applied. Verify (as {{ end_user }}) with:
      wpctl status, 'systemctl --user status pipewire', speaker-test -c 2.
