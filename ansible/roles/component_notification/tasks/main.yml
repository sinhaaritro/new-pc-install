---
- name: Install component packages
  ansible.builtin.include_role:
    name: install_packages
  vars:
    package_source: "{{ packages.component_notification }}"

- name: Stow component config
  ansible.builtin.command: "stow -R mako"
  args:
    chdir: "/home/{{ target_user }}/dotfiles"
    creates: "/home/{{ target_user }}/.config/mako"
  become: true
  become_user: "{{ target_user }}"
