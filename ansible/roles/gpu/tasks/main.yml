---
# Variant-selected: inventory gpu_variant names the x_packages.gpu key; ~ disables the role.
- name: Install gpu x_packages ({{ gpu_variant }})
  ansible.builtin.include_role:
    name: install_packages
  vars:
    install_packages_source: "{{ x_packages.gpu[gpu_variant] }}"

- name: Enable nvidia-persistenced
  ansible.builtin.systemd:
    name: nvidia-persistenced
    enabled: true
    state: stopped
  when: gpu_variant | default('') | string is match('nvidia.*')
