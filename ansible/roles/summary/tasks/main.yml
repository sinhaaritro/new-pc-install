---
# Dump the resolved config for the operator (spec 002 section 4). Pure
# read-out; no state change.
- name: Show resolved configuration
  ansible.builtin.debug:
    msg:
      - "wm_choice: {{ wm_choice | default('~') }}"
      - "ui_mode: {{ ui_mode }}"
      - "active modules: {{ (modules | default({})) | dict2items | rejectattr('value', 'none') | map(attribute='key') | list }}"
      - "active components: {{ (desktop_config.components | default({})) | dict2items | rejectattr('value', 'none') | map(attribute='key') | list }}"
      - "model_dir: {{ model_dir | default('n/a') }}"
