---
# Role: firewall (manifest module id: firewall)
# Phase 2 module 07 on the booted system. firewall_backend (inventory) both
# selects the backend and gates the role (mirrors gpu_vendor): 'ufw' runs
# tasks/ufw.yml; 'none' is a no-op; 'nftables'/'firewalld'/'iptables' are
# declared but not implemented yet (they hit the "not implemented" gate).
# Distro-specific data (packages) lives in group_vars under firewall:<backend>.
# Service/enable/verify and the rule commands are role-local in ufw.yml (the
# firewall CLI is distro-agnostic; only the package manager differs).

- name: Assert firewall_backend selects a known backend (module firewall)
  ansible.builtin.assert:
    that:
      - firewall_backend is defined
      - firewall_backend in firewall
    fail_msg: >-
      firewall_backend "{{ firewall_backend | default('') }}" must be one of
      {{ firewall.keys() | join(', ') }}. Set it in ansible/inventory/hosts.yml.
    success_msg: firewall_backend={{ firewall_backend }}

- name: Gate unimplemented firewall backends (module firewall)
  ansible.builtin.assert:
    that:
      - firewall_backend in ['ufw', 'none']
    fail_msg: >-
      firewall_backend "{{ firewall_backend }}" is declared but not implemented
      yet. Implemented backends: ufw, none.

- name: Note firewall backend none skips install (module firewall)
  ansible.builtin.debug:
    msg: "firewall_backend=none - no firewall is installed."
  when: firewall_backend == 'none'

- name: Load backend-specific firewall tasks (module firewall)
  ansible.builtin.include_tasks: "{{ firewall_backend }}.yml"
  when: firewall_backend in ['ufw']
