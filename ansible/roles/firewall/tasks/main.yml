---
# Role: firewall (manifest module id: firewall)
# Phase 2 module 07 on the booted system: ufw with deny-incoming /
# allow-outgoing defaults, enabled non-interactively (--force skips the
# "may disable existing connections" prompt). SSH rule is optional via the
# firewall_allow_ssh inventory var (spec 004 D2/D4).

- name: Load distro defaults (firewall)
  ansible.builtin.include_vars:
    file: "defaults/{{ ansible_distro }}.yml"

- name: Install ufw (module firewall)
  ansible.builtin.shell: pacman -S --noconfirm {{ firewall_packages | join(' ') }}
  args:
    executable: /bin/bash
  become: true
  register: firewall_pacman
  changed_when: firewall_pacman.rc == 0

- name: Configure ufw default rules (module firewall)
  ansible.builtin.shell: ufw default deny incoming && ufw default allow outgoing
  args:
    executable: /bin/bash
  become: true
  register: firewall_defaults
  changed_when: firewall_defaults.rc == 0

- name: Allow SSH through ufw (module firewall)
  ansible.builtin.shell: ufw allow ssh
  args:
    executable: /bin/bash
  become: true
  register: firewall_ssh
  changed_when: firewall_ssh.rc == 0
  when: firewall_allow_ssh | default(false)

- name: Enable ufw (module firewall)
  ansible.builtin.shell: ufw --force enable && systemctl enable ufw
  args:
    executable: /bin/bash
  become: true
  register: firewall_enable
  changed_when: firewall_enable.rc == 0

- name: Report firewall verification (module firewall)
  ansible.builtin.debug:
    msg: >-
      ufw applied. Verify with: sudo ufw status verbose
      (expect 'Status: active'). Note: with deny-incoming, any service you
      later expose needs its own 'sudo ufw allow <port>' rule.
