---
# Module 02 (snapshots): package list sourced from vars/distros/archlinux.yml.
snapshots_packages: "{{ distro_packages.snapshots }}"

# snapper retention and ACL settings applied to /etc/snapper/configs/root.
snapshots_retention:
  ALLOW_USERS: "{{ end_user }}"
  ALLOW_GROUPS: "wheel"
  SYNC_ACL: "yes"
  TIMELINE_MIN_AGE: "1800"
  TIMELINE_LIMIT_HOURLY: "5"
  TIMELINE_LIMIT_DAILY: "7"
  TIMELINE_LIMIT_WEEKLY: "0"
  TIMELINE_LIMIT_MONTHLY: "0"
  TIMELINE_LIMIT_YEARLY: "0"
