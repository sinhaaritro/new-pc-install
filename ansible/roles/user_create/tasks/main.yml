---
- name: Create target user in chroot
  ansible.builtin.command: >
    chroot {{ target_root }}
    useradd -m -G wheel -s /usr/bin/bash {{ target_user }}
  register: user_create_useradd
  changed_when: "'already exists' not in (user_create_useradd.stderr | default(''))"

- name: Set password for target user in chroot
  ansible.builtin.command: >
    chroot {{ target_root }}
    usermod -p '{{ user_password_hash }}' {{ target_user }}
  no_log: true
  changed_when: true
  when: user_password_hash | default('') | length > 0

- name: Enable sudo for wheel in chroot
  ansible.builtin.copy:
    dest: "{{ target_root }}/etc/sudoers.d/wheel"
    content: "%wheel ALL=(ALL:ALL) ALL\n"
    mode: "0440"
    validate: "chroot {{ target_root }} visudo -cf %s"

- name: Register target_uid
  ansible.builtin.getent:
    database: passwd
    key: "{{ target_user }}"
  register: target_uid
  changed_when: false
