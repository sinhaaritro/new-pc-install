---
- name: Install component packages
  ansible.builtin.include_role:
    name: install_packages
    vars:
      package_source: "{{ packages.component_bar }}"

- name: Stow component config
  ansible.builtin.command: "stow -R waybar"
  args:
    chdir: "/home/{{ target_user }}/dotfiles"
    creates: "/home/{{ target_user }}/.config/waybar"
  become: true
  become_user: "{{ target_user }}"
