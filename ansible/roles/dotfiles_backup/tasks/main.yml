---
# Role: dotfiles_backup (manifest module id: dotfiles-backup)
# Phase 4 SHARED module on the booted system (all profiles): GNU Stow + a git
# repo at ~/dotfiles as the ownership boundary for all user dotfiles
# (spec 006 D9, ADR-011/023). The role is config-free: it installs stow,
# bootstraps the repo only if it does not already exist (never 'git init'
# over an existing repo), and prints the naming convention + adopt workflow.
# It moves no files and writes no stow package contents - adopting existing
# configs is an interactive, user-judgment step.

- name: Resolve dotfiles-backup backends (module dotfiles-backup)
  ansible.builtin.set_fact:
    install_backends: "{{ distro_packages.dotfiles_backup }}"

- name: Install GNU Stow by backend (module dotfiles-backup)
  ansible.builtin.import_tasks: ../_common/tasks/install_by_backend.yml

- name: Check whether ~/dotfiles already exists (module dotfiles-backup)
  ansible.builtin.stat:
    path: /home/{{ end_user }}/dotfiles
  become: false
  register: dotfiles_backup_dir

- name: Check whether ~/dotfiles is already a git repo (module dotfiles-backup)
  ansible.builtin.stat:
    path: /home/{{ end_user }}/dotfiles/.git
  become: false
  register: dotfiles_backup_git

- name: Bootstrap ~/dotfiles as a git repo (module dotfiles-backup)
  ansible.builtin.shell: |
    set -e
    mkdir -p /home/{{ end_user }}/dotfiles
    cd /home/{{ end_user }}/dotfiles
    git init
  args:
    executable: /bin/bash
  become: false
  when: not dotfiles_backup_dir.stat.exists
  register: dotfiles_backup_init
  changed_when: dotfiles_backup_init.rc == 0

- name: Report dotfiles-backup workflow (module dotfiles-backup)
  ansible.builtin.debug:
    msg: >-
      Stow installed; ~/dotfiles git repo present
      ({{ 'created now' if not dotfiles_backup_dir.stat.exists else 'already existed - left untouched' }}).
      Naming convention: [type]_[name]_[variant]
      (p = package-specific, e.g. p_kitty; s = style group, e.g. s_dark_theme).
      Suggested stow packages: p_hyprland/.config/hypr/, p_kitty/.config/kitty/,
      p_waybar/.config/waybar/, p_rofi/.config/rofi/, p_zsh/.zshrc,
      p_neovim/.config/nvim/, p_swaync/.config/swaync/.
      To adopt an existing config: move it into ~/dotfiles/<pkg>/ mirroring the
      home-relative path, then 'cd ~/dotfiles && stow <pkg>' (or
      'stow --adopt <pkg>' followed by 'git checkout -- .' to restore the repo
      versions). This role moves no files on your behalf. Verify:
      stow --version; ls -la ~/dotfiles/.git.
