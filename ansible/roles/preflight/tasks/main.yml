---
# Role: preflight (manifest module ids: overview, pre-flight, verify-boot)
# Phase 0's real steps (BIOS Secure Boot, Fast Startup, USB flashing, UEFI boot)
# are manual and pre-Linux. This role is the single Phase 0/01 assertion gate:
# it verifies UEFI mode, network reachability, NTP sync, and that the target
# drive is present. It halts with a clear message on any failure.
# Run after the manual Phase 0 steps in os/archlinux/phase-0-pre-install/.
# Covers manifest modules overview, pre-flight, and verify-boot (merged; the
# standalone verify_boot role was removed in spec 003).

- name: Assert UEFI firmware is present (module overview - linux stack context)
  ansible.builtin.stat:
    path: "{{ efi_dir }}"
  register: preflight_efi_dir

- name: Assert system is booted in UEFI mode (module verify-boot)
  ansible.builtin.assert:
    that:
      - preflight_efi_dir.stat.exists
      - preflight_efi_dir.stat.isdir
    fail_msg: >-
      Not booted in UEFI mode ({{ efi_dir }} missing).
      Reboot and select the UEFI entry for the live USB.
    success_msg: UEFI mode confirmed

- name: Assert internet connectivity (module verify-boot)
  ansible.builtin.shell: ping -c 3 -W 5 archlinux.org
  args:
    executable: /bin/bash
  changed_when: false

- name: Enable NTP time synchronization
  ansible.builtin.shell: timedatectl set-ntp true
  args:
    executable: /bin/bash
  register: preflight_ntp
  changed_when: preflight_ntp.rc == 0

- name: Read timedatectl state
  ansible.builtin.command: timedatectl
  changed_when: false
  register: preflight_timedatectl

- name: Assert NTP service is active
  ansible.builtin.assert:
    that:
      - "'NTP service: active' in preflight_timedatectl.stdout"
    fail_msg: >-
      NTP is not active after timedatectl set-ntp true.
      Check network connectivity and retry.
    success_msg: NTP active

- name: Assert target_drive is configured
  ansible.builtin.assert:
    that:
      - target_drive is defined
      - target_drive | length > 0
    fail_msg: >-
      target_drive is empty. Identify your drive with
      'lsblk -o NAME,SIZE,MODEL' and set target_drive in
      ansible/inventory/hosts.yml before running the play.
    success_msg: target_drive is set to {{ target_drive }}

- name: Check target drive presence and model
  ansible.builtin.shell: |
    set -e
    [ -b "/dev/{{ target_drive }}" ]
    if [ -n "{{ target_drive_model }}" ] && [ -r "/sys/block/{{ target_drive }}/device/model" ]; then
      grep -q "{{ target_drive_model }}" "/sys/block/{{ target_drive }}/device/model"
    fi
  args:
    executable: /bin/bash
  register: preflight_target_drive
  changed_when: false

- name: Assert target drive is present and matches
  ansible.builtin.assert:
    that:
      - preflight_target_drive.rc == 0
    fail_msg: >-
      Target drive /dev/{{ target_drive }} is missing or its model does not
      match target_drive_model. Run 'lsblk -o NAME,SIZE,MODEL', confirm the
      correct drive, and update target_drive/target_drive_model in
      ansible/inventory/hosts.yml.
    success_msg: Target drive {{ target_drive }} present
