---
# Enable linger and registered user units (spec 002 section 4; spec 001
# decision 2.15: enable, never start — starting a unit from a play races the
# display manager at boot).
- name: Enable lingering for target user
  ansible.builtin.command: "loginctl enable-linger {{ x_target_user }}"
  changed_when: false
  register: user_services_linger_rc
  failed_when: "'linger' not in (user_services_linger_rc.stdout | default('')) and user_services_linger_rc.rc != 0"

- name: Enable registered user units
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    scope: user
    state: stopped
  become: true
  become_user: "{{ x_target_user }}"
  loop: "{{ user_units | default([]) }}"
  loop_control:
    label: "{{ item }}"
