---
# Role: install_base (manifest module id: install-base)
# Module 04: reflector mirror selection, keyring upgrade, pacstrap base.
# CPU microcode is selected by the per-machine cpu_vendor var
# (distro_packages.ucode.<vendor> in vars/distros/archlinux.yml).

- name: Assert cpu_vendor and fstype select known packages (module install-base)
  ansible.builtin.assert:
    that:
      - cpu_vendor in distro_packages.ucode
      - fstype in distro_packages.fstools
    fail_msg: >-
      cpu_vendor "{{ cpu_vendor | default('') }}" must be one of
      {{ distro_packages.ucode.keys() | join(', ') }} and fstype
      "{{ fstype | default('') }}" must be one of
      {{ distro_packages.fstools.keys() | join(', ') }}.
      Set both in ansible/inventory/hosts.yml.
    success_msg: >-
      cpu_vendor={{ cpu_vendor }} -> {{ distro_packages.ucode[cpu_vendor] }},
      fstype={{ fstype }} -> {{ distro_packages.fstools[fstype] }}

- name: Select mirrors for the country (module install-base)
  ansible.builtin.shell: reflector --country {{ country }} --latest 5 --sort rate --save /etc/pacman.d/mirrorlist
  args:
    executable: /bin/bash
  register: install_base_reflector
  changed_when: install_base_reflector.rc == 0

- name: Upgrade archlinux keyring
  ansible.builtin.command: pacman -Sy archlinux-keyring
  register: install_base_keyring
  changed_when: install_base_keyring.rc == 0

- name: pacstrap base system (module install-base)
  ansible.builtin.shell: pacstrap -K {{ mount_point }} {{ (base_packages + [distro_packages.ucode[cpu_vendor], distro_packages.fstools[fstype]]) | join(' ') }}
  args:
    executable: /bin/bash
