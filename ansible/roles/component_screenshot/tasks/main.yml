---
- name: Install component packages
  ansible.builtin.include_role:
    name: install_packages
  vars:
    package_source: "{{ packages.component_screenshot }}"

- name: Stow component config
  ansible.builtin.command: "stow -R screenshots"
  args:
    chdir: "/home/{{ target_user }}/dotfiles"
    creates: "/home/{{ target_user }}/.config/screenshots"
  become: true
  become_user: "{{ target_user }}"
