---
# Role: external_drives (manifest module id: external-drives)
# Phase 2 module 08 on the booted system: NTFS + auto-mount packages. When
# drive_uuid and drive_mount are both set in inventory, a permanent fstab
# entry (ntfs) plus mountpoint is written; otherwise the manual mapping steps
# are printed for the user to do after identifying drives (spec 004 D4).
# The USB plug-in test is user verification.
# Package list is read from the global distro file (ADR-002).

- name: Install NTFS and auto-mount packages (module external-drives)
  ansible.builtin.shell: "{{ distro_install }} {{ distro_packages.external_drives | join(' ') }}"
  args:
    executable: /bin/bash
  become: true
  register: external_drives_pacman
  changed_when: external_drives_pacman.rc == 0

- name: Create the external drive mountpoint (module external-drives)
  ansible.builtin.file:
    path: "{{ drive_mount }}"
    state: directory
    mode: "0755"
  become: true
  when:
    - (drive_uuid | default('') | length) > 0
    - (drive_mount | default('') | length) > 0

- name: Add the external drive to fstab (module external-drives)
  ansible.builtin.lineinfile:
    path: "{{ distro_paths.fstab }}"
    regexp: "UUID={{ drive_uuid }} "
    line: "UUID={{ drive_uuid }}  {{ drive_mount }}  ntfs  defaults  0 0"
    state: present
  become: true
  when:
    - (drive_uuid | default('') | length) > 0
    - (drive_mount | default('') | length) > 0

- name: Print drive mapping instructions (module external-drives)
  ansible.builtin.debug:
    msg: >-
      drive_uuid/drive_mount are not both set, so no fstab entry was written.
      To map a drive: run 'lsblk -f', note the UUID, then set drive_uuid and
      drive_mount in ansible/inventory/hosts.yml and re-run this module
      (or add 'UUID=<uuid>  <mountpoint>  ntfs  defaults  0 0' to /etc/fstab
      by hand and create the mountpoint under /mnt).
      For removable media auto-mount, add 'exec-once = udiskie &' to your
      Hyprland autostart (Phase 3). Verify: lsblk -f shows the mountpoint;
      a plugged-in USB drive auto-mounts under /media or /run/media.
