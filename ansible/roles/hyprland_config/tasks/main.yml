---
# Role: hyprland_config (manifest module id: hyprland-config)
# Phase 3 module 02 on the booted system: Hyprland core configuration
# (keybinds, monitors, window rules, input). Config-free (ADR-014): this
# module is package-free and writes no hyprland.conf - the user's stow
# package owns it. This role only prints what stow must provide + the
# verification steps.

- name: Report Hyprland core-config stow handoff (module hyprland-config)
  ansible.builtin.debug:
    msg: >-
      No packages to install. Your stow package should provide
      ~/.config/hypr/hyprland.conf with keybinds, monitor lines, window
      rules, and input (see Phase 3 module 02 Core Config). Verify after
      stowing: hyprctl reload applies changes; hyprctl monitors matches your
      monitor= lines; SUPER+Q opens Kitty.
