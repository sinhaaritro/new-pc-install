---
# Loops the roster null-filtered (ADR-003): `~` in inventory subtracts, absence
# takes the default. Key names map to app_<key> roles; `model_store` is the
# one entry whose role is not app_-prefixed.
- name: AI apps
  ansible.builtin.include_role:
    name: "{{ 'app_' ~ item.key if item.key != 'model_store' else 'ai_model_store' }}"
  vars:
    app_params: "{{ item.value }}"
    workflow_roster: >-
      {{ workflow_ai_module_cli
         | combine(workflow_ai_module_gui if x_ui_mode == 'gui' else {})
         | combine(app_overrides | default({}), recursive=True) }}
  loop: "{{ workflow_roster | dict2items | rejectattr('value', 'none') | list }}"
  loop_control:
    label: "{{ item.key }}"
