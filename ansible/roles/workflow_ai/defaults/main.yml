---
# Roster split (spec 002 section 4 contract): all AI apps work headless, so
# module_cli holds the whole roster and module_gui is empty. The derived
# roster is computed in tasks/main.yml under module_roster (the
# defaults-file key `module_defaults` is an Ansible reserved name and cannot
# legally appear in a vars file - spec 004 / ADR-033); no task gates on
# x_ui_mode.
workflow_ai_module_cli:
  llamacpp: {}
  opencode: {}
  model_store: {}
workflow_ai_module_gui: {}
