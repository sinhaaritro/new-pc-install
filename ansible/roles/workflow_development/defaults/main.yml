---
# ADR-021 roster split: desktop-only apps live in module_gui and simply do not
# exist on a cli box; no task anywhere gates on x_ui_mode with a conditional.
# Key names are load-bearing (spec 002 section 4 contract + Task 5 audit
# greps). The derived roster is computed in tasks/main.yml under
# module_roster (the defaults-file key `module_defaults` is an Ansible
# reserved name and cannot legally appear in a vars file - spec 004 / ADR-033).
workflow_development_module_cli:
  git: {}
  neovim: {}
  docker: {}
  lang_toolchains: {}
workflow_development_module_gui:
  vscode: {}
