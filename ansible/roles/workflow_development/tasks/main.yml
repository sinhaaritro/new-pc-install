---
# Loops the roster null-filtered (ADR-003): `~` in inventory subtracts, absence
# takes the default. The roster itself was already x_ui_mode-gated in defaults.
- name: Development apps
  ansible.builtin.include_role:
    name: "app_{{ item.key }}"
  vars:
    app_params: "{{ item.value }}"
    workflow_roster: >-
      {{ workflow_development_module_cli
         | combine(workflow_development_module_gui if x_ui_mode == 'gui' else {})
         | combine(app_overrides | default({}), recursive=True) }}
  loop: "{{ workflow_roster | dict2items | rejectattr('value', 'none') | list }}"
  loop_control:
    label: "{{ item.key }}"
