---
# Builds paru as the target user. The entire build is one guarded command: once
# /usr/bin/paru exists the task is a no-op and never re-triggers.
- name: Build {{ x_commands.aur.install }}
  ansible.builtin.command: >
    makepkg -si --noconfirm
  args:
    chdir: /home/{{ x_target_user }}/.cache/paru/clone/paru
    creates: /usr/bin/paru
  become: true
  become_user: "{{ x_target_user }}"
  changed_when: true
