---
# Shared defaults for Play 1 (Phase 0-1, live-USB install).
# Var layering (spec 002): per-machine values live in inventory/hosts.yml;
# static shared layout constants live here; distro-specific data lives in
# vars/distros/<distro>.yml.
ansible_distro: archlinux
# Where the new system is mounted on the live USB.
mount_point: /mnt
# UEFI efivars path (kernel ABI, distro-agnostic) - UEFI-mode assertion.
efi_dir: /sys/firmware/efi/efivars
# Destructive gate: the play will NOT write a GPT table unless this is passed.
confirm_destructive: false
