---
# Play 1 inventory: the live-USB host itself (operator is already root).
# Fill in target_drive* before running the play (see README.md, Phase 0).
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: /usr/bin/python3
      ansible_distro: archlinux
      # --- Drive selection (single place to put the drive) ---
      target_drive: ""
      target_drive_model: ""
      target_drive_size: ""
      # --- CPU ---
      # Microcode package selection: amd -> amd-ucode, intel -> intel-ucode
      # (see distro_packages.ucode in vars/distros/archlinux.yml).
      cpu_vendor: amd
      # --- GPU (Phase 1, runs in chroot before bootloader) ---
      # Vendor select: nvidia | amd | intel | none. 'nvidia' runs the driver
      # install; 'none' skips; 'amd'/'intel' hit a "not implemented" gate.
      # No separate enable flag — gpu_vendor is the gate.
      gpu_vendor: nvidia
      # NVIDIA base driver: nvidia-open (Turing/RTX 20xx+, default) or
      # nvidia (Maxwell-Pascal, GTX 9xx/10xx). Only used when
      # gpu_vendor: nvidia.
      nvidia_driver: nvidia-open
      # --- System identity ---
      hostname: archlinux
      timezone: Asia/Kolkata
      locale: en_US.UTF-8
      end_user: aritro
      # --- Layout (per-machine sizing) ---
      efi_size: 2G
      swap: true
      swap_size: 64G
      # --- Selectable layout (spec 003) ---
      # Root filesystem type; only 'btrfs' is implemented so far.
      fstype: btrfs
      # Bootloader; only 'grub' is implemented so far.
      bootloader: grub
      # Optional: make a specific GRUB menu entry the default.
      # "saved" = remember last selection (GRUB_DEFAULT=saved + SAVEDEFAULT).
      # Any other value = exact menuentry title, e.g.
      #   grub_default: "Windows Boot Manager (on /dev/nvme0n1p1)"
      # Empty/unset = first entry (Arch Linux) is the default.
      # grub_default: ""
      # --- Passwords (spec 003) ---
      # Non-empty value pre-fills the prompt (skips the keyboard read);
      # empty or absent prompts interactively.
      # root_password: ""
      # end_user_password: ""
      # --- Sudo (Phase 1 module 06) ---
      # Optional: commands wheel members may run without a password.
      # Empty list = standard "%wheel ALL=(ALL:ALL) ALL" only.
      # wheel_nopasswd_commands:
      #   - /usr/bin/shutdown
      #   - /usr/bin/reboot
      #   - /usr/bin/pacman -Syu
      #   - /usr/bin/pacman -Syyu
      #   - /usr/bin/pacman -Rns
      # --- Mirror selection ---
      country: India
      # --- Wi-Fi (Phase 1 module 01) ---
      # Set wifi_ssid to connect to Wi-Fi during verify_boot_network
      # (non-interactive iwctl); leave empty for Ethernet (wired connects automatically).
      # wifi_ssid: ""
      # wifi_password: ""
      # Set to true on the live USB to pass the destructive gate
      # (equivalent to the --confirm-destructive flag in the Makefile run target).
      # confirm_destructive: true
      # ===========================================================================
      # Play 2 (Phase 2, booted system) — run as {{ end_user }} (wheel) after
      # Phase 1 first reboot. See ansible/README.md for the Play 2 user flow.
      # ===========================================================================
      # --- Phase 2 module flags (flag OR --tags selects a module) ---
      # Recommended modules default on; optional modules default off.
      enable_snapshots: true
      enable_aur: true
      enable_sound: true
      enable_ssh: true
      enable_networking: false
      enable_clock_sync: false
      enable_firewall: false
      enable_external_drives: false
      # --- Optional Phase 2 identity vars (empty = prompt at run time) ---
      git_name: sinhaaritro
      git_email: sinhaaritro@gmail.com
      # ssh_email: ""
      # ssh_passphrase: ""
      # --- Optional firewall var ---
      # Allow SSH through ufw (recommended when enable_ssh: true).
      firewall_allow_ssh: true
      # --- Optional external-drive mapping (both set = fstab entry written) ---
      # drive_uuid: ""
      # drive_mount: ""
      # ===========================================================================
      # Play 3 (Phase 3, booted system) — run as {{ end_user }} (wheel) after
      # Phase 2. Config-free: packages + services only; all dotfiles are owned
      # by the user's stow package. See ansible/README.md for the Play 3 flow.
      # ===========================================================================
      # --- Window manager (spec 005 D3) ---
      # Selectable WM: hyprland | niri | sway | none. Only hyprland is
      # implemented; niri/sway hit a "not implemented" gate for now.
      wm_vendor: hyprland
      # --- Phase 3 module flags (flag OR --tags selects a module) ---
      # Hyprland modules (sequential): 01-install gates 02-05.
      # Required/Recommended default on; Optional default off (README).
      enable_hyprland_install: true
      enable_hyprland_config: true
      enable_hyprland_lock: true
      enable_hyprland_wallpaper: false
      enable_hyprland_screenshare: true
      # Shared desktop modules (order flexible).
      enable_shell_terminal: true
      enable_app_launcher: true
      enable_status_bar: true
      enable_notifications: true
      enable_display_manager: false
      enable_clipboard: true
      enable_screenshots: false
      enable_file_manager: true
      enable_fonts: true
      # ===========================================================================
      # Play 4 (Phase 4, booted system) — run as {{ end_user }} (wheel) after
      # Phase 3. System-level only (ADR-016): packages + services + 4 named
      # artifacts; all dotfiles are owned by the user's stow package.
      # ===========================================================================
      # --- Profile selection (spec 006 D1) ---
      # A profile var ORs into every enable_<id> flag of its modules:
      #   profile_dev: true  -> enables all 5 dev modules
      #   profile_ai: true   -> enables all 5 ai modules
      #   profile_creative/gaming likewise.
      # Per-module flags below default to false; the profile vars drive
      # selection. For per-module control, set the profile vars to false and
      # flip individual flags. A module cannot be switched OFF while its
      # profile is ON (OR-semantics) — narrow at run time with --tags.
      profile_dev: true
      profile_ai: true
      profile_creative: false
      profile_gaming: false
      # --- Phase 4 per-module flags (flag OR --tags selects a module) ---
      # Shared (all profiles).
      enable_dotfiles_backup: true
      # Developer profile.
      enable_neovim: false
      enable_containers: false
      enable_devpod: false
      enable_languages: false
      enable_api_testing: false
      # AI profile.
      enable_inference: false
      enable_harness: false
      enable_ide_integration: false
      enable_agents: false
      enable_training: false
      # Gaming profile.
      enable_steam: false
      enable_proton: false
      enable_heroic: false
      enable_mangohud: false
      enable_controllers: false
      # Creative profile.
      enable_obs: false
      enable_davinci: false
      enable_media_players: false
      # --- Phase 4 optional vars ---
      # Download the AI model GGUFs (tens of GB) during the run. Default off:
      # a default run never touches the network for models (spec 006 D5).
      enable_ai_models: false
      # GPU index for the llama-server unit's CUDA_VISIBLE_DEVICES.
      inference_cuda_device: 0
