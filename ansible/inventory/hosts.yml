---
# Play 1 inventory: the live-USB host itself (operator is already root).
# Fill in target_drive* before running the play (see README.md, Phase 0).
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: /usr/bin/python3
      ansible_distro: archlinux
      # --- Drive selection (single place to put the drive) ---
      target_drive: ""
      target_drive_model: ""
      target_drive_size: ""
      # --- CPU ---
      # Microcode package selection: amd -> amd-ucode, intel -> intel-ucode
      # (see distro_packages.ucode in vars/distros/archlinux.yml).
      cpu_vendor: amd
      # --- System identity ---
      hostname: archlinux
      timezone: Asia/Kolkata
      locale: en_US.UTF-8
      end_user: aritro
      # --- Layout (per-machine sizing) ---
      efi_size: 2G
      swap: true
      swap_size: 64G
      # --- Selectable layout (spec 003) ---
      # Root filesystem type; only 'btrfs' is implemented so far.
      fstype: btrfs
      # Bootloader; only 'grub' is implemented so far.
      bootloader: grub
      # --- Passwords (spec 003) ---
      # Non-empty value pre-fills the prompt (skips the keyboard read);
      # empty or absent prompts interactively.
      # root_password: ""
      # end_user_password: ""
      # --- Mirror selection ---
      country: India
      # --- Wi-Fi (Phase 1 module 01) ---
      # Set wifi_ssid to connect to Wi-Fi during preflight (non-interactive
      # iwctl); leave empty for Ethernet (wired connects automatically).
      # wifi_ssid: ""
      # wifi_password: ""
      # Set to true on the live USB to pass the destructive gate
      # (equivalent to the --confirm-destructive flag in the Makefile run target).
      # confirm_destructive: true
      # ===========================================================================
      # Play 2 (Phase 2, booted system) — run as {{ end_user }} (wheel) after
      # Phase 1 first reboot. See ansible/README.md for the Play 2 user flow.
      # ===========================================================================
      # --- GPU (spec 004 D3) ---
      # Vendor select: nvidia | amd | intel | none. Only nvidia and none are
      # implemented; amd/intel hit a "not implemented" gate for now.
      gpu_vendor: nvidia
      # --- Phase 2 module flags (flag OR --tags selects a module) ---
      # Recommended modules default on; optional modules default off.
      enable_nvidia: true
      enable_snapshots: true
      enable_aur: true
      enable_sound: true
      enable_ssh: true
      enable_networking: false
      enable_clock_sync: false
      enable_firewall: false
      enable_external_drives: false
      # --- Optional Phase 2 identity vars (empty = prompt at run time) ---
      # git_name: ""
      # git_email: ""
      # ssh_email: ""
      # ssh_passphrase: ""
      # --- Optional firewall var ---
      # Allow SSH through ufw (recommended when enable_ssh: true).
      firewall_allow_ssh: true
      # --- Optional external-drive mapping (both set = fstab entry written) ---
      # drive_uuid: ""
      # drive_mount: ""
