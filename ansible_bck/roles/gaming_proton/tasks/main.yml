- name: Report proton placeholder status (module proton)
  ansible.builtin.debug:
    msg: >-
      NOTE: the doc is a placeholder - no packages are installed. Planned
      scope (pending in os/archlinux/phase-4-workflow/profile-gaming/proton.md):
