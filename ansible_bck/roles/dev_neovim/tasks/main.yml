---
# Role: dev_neovim (manifest module id: neovim)
# Phase 4 profile-dev module - THIN (spec 006 D3): the doc
# (profile-dev/neovim.md) is a placeholder, so this role installs only the
# manifest-listed package (neovim) and prints the pending manual steps.
# The lazy.nvim plugin spec (LSP, treesitter) is stow-owned regardless.

- name: Resolve neovim backends (module neovim)
  ansible.builtin.set_fact:
    install_backends: "{{ distro_packages.neovim }}"

- name: Install neovim by backend (module neovim)
  ansible.builtin.import_tasks: ../_common/tasks/install_by_backend.yml

- name: Report neovim placeholder status (module neovim)
  ansible.builtin.debug:
    msg: >-
      neovim installed. NOTE: the doc is a placeholder - the package set is
      manifest-only and the remaining manual steps (plugin manager bootstrap,
      LSP servers, treesitter) are pending in
      os/archlinux/phase-4-workflow/profile-dev/neovim.md. Your stow package
      should own ~/.config/nvim/ (lazy.nvim spec, init.lua). Verify:
      nvim --version.
