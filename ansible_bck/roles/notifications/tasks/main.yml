---
# Role: notifications (manifest module id: notifications)
# Phase 3 shared module on the booted system: swaync notification center +
# mako fallback. Config-free (ADR-011): installs the packages only;
# ~/.config/swaync/ and the 'exec-once = swaync' autostart + SUPER+N keybind
# are owned by the user's stow package.

- name: Resolve notification backends (module notifications)
  ansible.builtin.set_fact:
    install_backends: "{{ distro_packages.notifications }}"

- name: Install swaync and mako by backend (module notifications)
  ansible.builtin.import_tasks: ../_common/tasks/install_by_backend.yml

- name: Report notifications verification (module notifications)
  ansible.builtin.debug:
    msg: >-
      swaync + mako installed. Your stow package should provide
      ~/.config/swaync/style.css (and optional swaync.jsonc), plus
      'exec-once = swaync' and a SUPER+N toggle keybind in hyprland.conf (see
      Phase 3 module Notifications). Verify: 'notify-send Test Hello' shows a
      notification; SUPER+N toggles the notification window.
