---
# Role: fonts (manifest module id: fonts)
# Phase 3 shared module on the booted system: the monospace/primary font +
# Nerd Fonts + Noto (latin/CJK/emoji) + Material Design Icons + fontconfig.
# Writes a system-wide /etc/fonts/local.conf with the primary-font fallback
# chain (display-server agnostic: applies to both Wayland and X11), then runs
# fc-cache. ADR-011: local.conf is a system config (not a user dotfile), so
# this role owns it; the user's stow package may additionally provide
# ~/.config/fontconfig/fonts.conf for per-user overrides.

- name: Resolve font backends (module fonts)
  ansible.builtin.set_fact:
    install_backends: "{{ distro_packages.fonts }}"

- name: Install font packages by backend (module fonts)
  ansible.builtin.import_tasks: ../_common/tasks/install_by_backend.yml

- name: Write the system-wide fontconfig fallback (module fonts)
  ansible.builtin.template:
    src: local.conf.j2
    dest: /etc/fonts/local.conf
    mode: "0644"
  become: true

- name: Rebuild the fontconfig cache (module fonts)
  ansible.builtin.shell: fc-cache -fv
  args:
    executable: /bin/bash
  become: true
  register: fonts_fc_cache
  changed_when: fonts_fc_cache.rc == 0

- name: Report fonts verification (module fonts)
  ansible.builtin.debug:
    msg: >-
      Font packages installed; /etc/fonts/local.conf written (primary
      monospace + CJK/emoji + Nerd Font icon fallbacks); fc-cache rebuilt.
      Log out/in so running apps pick up the new fonts. Applies to both
      Wayland and X11 (fontconfig is display-server agnostic). Your stow
      package may provide ~/.config/fontconfig/fonts.conf for per-user
      overrides (see Phase 3 module Fonts). Verify: 'fc-list | wc -l' is
      healthy (200+); 'fc-match monospace' returns the configured primary
      font; CJK and emoji render in a browser; Nerd Font icons show in
      Kitty/waybar/rofi.
