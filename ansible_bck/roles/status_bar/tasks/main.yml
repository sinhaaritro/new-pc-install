---
# Role: status_bar (manifest module id: status-bar)
# Phase 3 shared module on the booted system: waybar status bar.
# Config-free (ADR-011): installs waybar only; ~/.config/waybar/ (config +
# style.css) and the 'exec-once = waybar' autostart are owned by the user's
# stow package.

- name: Resolve status-bar backends (module status-bar)
  ansible.builtin.set_fact:
    install_backends: "{{ distro_packages.status_bar }}"

- name: Install waybar by backend (module status-bar)
  ansible.builtin.import_tasks: ../_common/tasks/install_by_backend.yml

- name: Report status-bar verification (module status-bar)
  ansible.builtin.debug:
    msg: >-
      waybar installed. Your stow package should provide
      ~/.config/waybar/config and ~/.config/waybar/style.css, plus
      'exec-once = waybar' in hyprland.conf (see Phase 3 module Status Bar).
      Verify: the bar appears at the top with workspaces, clock, and system
      stats.
