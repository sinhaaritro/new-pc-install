---
# Role: gpu (manifest module id: nvidia)
# Phase 1 module: vendor-agnostic GPU setup, run in the chroot during the
# live-USB install. gpu_vendor (inventory) both selects the vendor and gates
# the role: 'nvidia' runs tasks/nvidia.yml; 'none' is a no-op; 'amd'/'intel'
# hit a "not implemented" gate. No separate enable flag.

- name: Assert gpu_vendor selects a known vendor (module nvidia)
  ansible.builtin.assert:
    that:
      - gpu_vendor is defined
      - gpu_vendor in gpu
    fail_msg: >-
      gpu_vendor "{{ gpu_vendor | default('') }}" must be one of
      {{ gpu.keys() | join(', ') }}. Set it in ansible/inventory/hosts.yml.
    success_msg: gpu_vendor={{ gpu_vendor }}

- name: Gate unimplemented GPU vendors (module nvidia)
  ansible.builtin.assert:
    that:
      - gpu_vendor in ['nvidia', 'none']
    fail_msg: >-
      gpu_vendor "{{ gpu_vendor }}" is declared but not implemented yet.
      Implemented vendors: nvidia, none.

- name: Note GPU vendor none skips driver install (module nvidia)
  ansible.builtin.debug:
    msg: "gpu_vendor=none - no GPU driver is installed (integrated or no GPU)."
  when: gpu_vendor == 'none'

- name: Load vendor-specific GPU tasks (module nvidia)
  ansible.builtin.include_tasks: "{{ gpu_vendor }}.yml"
  when: gpu_vendor in ['nvidia', 'amd', 'intel']
